[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-axiom"
version = "0.1.0"
description = "Origin Axiom — consolidated canonical repository: the proven mathematical core."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dritëro M." }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets a plain `pytest` invocation import both the installed-style `src` package and the
# repo-root `frontier`/`scripts` namespace packages without an install step or PYTHONPATH.
pythonpath = ["src", "."]
testpaths = ["tests"]
# `slow` marks the instrument-freshness sweep (B1054): it re-runs every arc instrument, ~5m20s.
# It is a suite test rather than a gate precisely because of that cost -- and it is the only thing
# that can see an instrument gone red behind a cached-green `results.json`.
markers = ["slow: re-runs arc instruments; minutes, not seconds"]
