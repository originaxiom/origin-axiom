name: Preserve weave runs 01-13
on:
  push:
    branches:
      - chatgpt/weave-physics-archive-2026-10-11
    paths:
      - reports/chatgpt_weave_2026_10_11/_transport/READY
permissions:
  contents: write
jobs:
  preserve:
    if: github.ref == 'refs/heads/chatgpt/weave-physics-archive-2026-10-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out only the archive branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chatgpt/weave-physics-archive-2026-10-11
          fetch-depth: 1
          sparse-checkout: |
            reports/chatgpt_weave_2026_10_11
      - name: Restore and check every original byte
        run: python3 reports/chatgpt_weave_2026_10_11/restore_archive.py
      - name: Commit only the verified archive
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "chatgpt/weave-physics-archive-2026-10-11"
          git add -f -- reports/chatgpt_weave_2026_10_11
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve original weave runs 01-13, initial audit, source, and all extracted artifacts'
          git push origin HEAD:refs/heads/chatgpt/weave-physics-archive-2026-10-11
